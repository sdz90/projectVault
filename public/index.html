<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- Login gate -->
  <div id="login" class="login hidden">
    <div class="login-card">
      <div class="mark">▚</div>
      <h1>Vault</h1>
      <p class="sub">A quiet corner for your files.</p>
      <button id="google-btn" class="btn-primary">Continue with Google</button>
    </div>
  </div>

  <!-- App -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand"><span class="mark-sm">▚</span> Vault</div>
      <div class="crumbs" id="crumbs"></div>
      <div class="spacer"></div>
      <div class="user" id="user"></div>
      <button id="signout" class="btn-ghost">Sign out</button>
    </header>

    <main class="stage" id="stage">
      <div class="toolbar">
        <div class="view-toggle" id="view-toggle">
          <button data-view="grid" class="vt-btn active" title="Grid view" aria-label="Grid view">▦</button>
          <button data-view="list" class="vt-btn" title="List view" aria-label="List view">☰</button>
        </div>
        <div class="spacer"></div>
        <button id="select-toggle" class="btn-ghost">Select</button>
        <button id="new-note" class="btn-ghost">New note</button>
        <button id="new-folder" class="btn-ghost">New folder</button>
        <label class="btn-primary upload-label">
          Upload files
          <input type="file" id="file-input" multiple hidden />
        </label>
      </div>

      <!-- Bulk action bar (shown in select mode) -->
      <div id="bulk-bar" class="bulk-bar hidden">
        <label class="bulk-check">
          <input type="checkbox" id="select-all" /> Select all
        </label>
        <span id="bulk-count" class="bulk-count">0 selected</span>
        <div class="spacer"></div>
        <button id="bulk-delete" class="btn-danger" disabled>Delete selected</button>
        <button id="select-cancel" class="btn-ghost">Cancel</button>
      </div>

      <div id="dropzone" class="dropzone">
        <div id="grid" class="grid"></div>
        <div id="empty" class="empty hidden">
          <p class="empty-title">Nothing here yet</p>
          <p class="empty-sub">Drag files in, or use Upload files above.</p>
        </div>
        <div id="drop-overlay" class="drop-overlay">Drop to upload</div>
      </div>
    </main>

    <div id="uploads" class="uploads"></div>
  </div>

  <!-- Preview modal -->
  <div id="preview" class="preview hidden">
    <button class="preview-close" id="preview-close">✕</button>
    <div class="preview-body" id="preview-body"></div>
  </div>

  <!-- Note editor modal -->
  <div id="note-modal" class="note-modal hidden">
    <div class="note-card">
      <div class="note-head">
        <input id="note-title" class="note-title" placeholder="Untitled note" />
        <button id="note-close" class="note-x" aria-label="Close">✕</button>
      </div>
      <textarea id="note-text" class="note-text" placeholder="Paste or type text here…"></textarea>
      <div class="note-foot">
        <span id="note-status" class="note-status"></span>
        <div class="spacer"></div>
        <button id="note-copy" class="btn-ghost">Copy all</button>
        <button id="note-save" class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <!-- Firebase + app -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
